name: Clear Weekly Photos

# Weekly Lines (index.html) shows the images in images/weekly-lines/. You
# upload them by hand on GitHub during the week (photos.html links to the
# upload page); this empties the folder every Tuesday morning, keeping
# .gitkeep so it still exists to upload into. It only deletes photos.
on:
  schedule:
    # 12:07 UTC = 8:07 AM EDT / 7:07 AM EST, Tuesday
    - cron: "7 12 * * 2"
  workflow_dispatch: {} # clear them now from the Actions tab

permissions:
  contents: write

concurrency:
  group: clear-photos
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clear weekly photos
        run: |
          for d in images/weekly-lines; do
            mkdir -p "$d"
            find "$d" -type f ! -name '.gitkeep' -delete
            touch "$d/.gitkeep"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A images/weekly-lines/
          git diff --staged --quiet && exit 0
          git commit -m "Clear weekly photos ($(date -u +%F))"
          git pull --rebase
          git push
