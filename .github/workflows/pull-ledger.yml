name: Sync Ledger

on:
  schedule:
    # 14:00 UTC = 9:00 AM EST, once daily - money movement isn't tied to
    # game days the way picks are, so this just runs every day.
    - cron: "0 14 * * *"
  workflow_dispatch: {} # lets you trigger a manual sync from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync ledger from sheet
        env:
          LEDGER_SHEET_CSV_URL: ${{ vars.LEDGER_SHEET_CSV_URL }}
        run: python scripts/fetch_ledger.py

      - name: Commit ledger.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json
          git diff --staged --quiet || git commit -m "Sync ledger ($(date -u +%F))"
          git push
