name: Pull Lines

on:
  schedule:
    # 14:07 UTC (not :00, deliberately - the top of every hour is the
    # most congested slot for GitHub's scheduler, and offsetting a few
    # minutes measurably reduces how often runs get delayed under load)
    # = ~9:07 AM EST (fixed UTC-5; drifts to ~8:07 AM local once
    # daylight saving ends in November - see README for details)
    - cron: "7 14 * * 1" # Monday
    - cron: "7 14 * * 2" # Tuesday
    - cron: "7 14 * * 3" # Wednesday
    - cron: "7 14 * * 4" # Thursday
    - cron: "7 14 * * 5" # Friday
    - cron: "7 14 * * 6" # Saturday
    # 23:07 UTC = ~6:07 PM EST - second same-day pull for Thu/Fri only,
    # to catch a fresher line closer to those nights' games. This
    # overwrites that day's morning snapshot (same stage name, same
    # file) rather than being tracked as a separate slot.
    - cron: "7 23 * * 4" # Thursday evening
    - cron: "7 23 * * 5" # Friday evening
  workflow_dispatch: {} # lets you trigger a manual pull from the Actions tab

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine stage from today's UTC weekday
        id: stage
        run: echo "name=$(date -u +%A | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Fetch lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_lines.py --stage ${{ steps.stage.outputs.name }}

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Pull lines: ${{ steps.stage.outputs.name }} ($(date -u +%F))"
          git push
