name: Sync Picks

on:
  schedule:
    # 14:00 UTC = 9:00 AM EST, Tuesday only
    - cron: "0 14 * * 2"
  workflow_dispatch: {} # lets you trigger a manual sync from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync picks from sheet
        env:
          PICKS_SHEET_CSV_URL: ${{ vars.PICKS_SHEET_CSV_URL }}
        run: python scripts/fetch_picks.py

      - name: Commit picks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/picks.json
          git diff --staged --quiet || git commit -m "Sync picks ($(date -u +%F))"
          git push
