name: Pull Splits

on:
  schedule:
    # Every 2 hours from Wednesday 5 AM Eastern until the Saturday 10:30 AM
    # lock. Cron is UTC-only: 09:05 UTC = 5:05 AM EDT / 4:05 AM EST. :05
    # instead of :00 because the top of the hour is GitHub's most delayed slot.
    #
    # fetch_splits.py also freezes every game at kickoff or the Saturday
    # 10:30 AM lock, whichever comes first (lock_time), so a scheduled run that
    # starts late - or a manual run - never puts later numbers on the page.
    - cron: "5 9-23/2 * * 3"     # Wed 09:05-23:05 UTC
    - cron: "5 1-23/2 * * 4,5"   # Thu, Fri - every odd UTC hour
    - cron: "5 1-13/2 * * 6"     # Sat 01:05-13:05 UTC
    - cron: "5 14 * * 6"         # Sat 14:05 UTC = 10:05 AM EDT / 9:05 AM EST, closest slot to the lock
    # Two score-only runs after the weekend's games, so finished Sharp plays get
    # their W/L before the slate turns over. Every game is already locked by
    # then (kickoff or the Saturday 10:30 AM lock), so these change no line or
    # split on the page - they only bring in final scores.
    - cron: "5 10 * * 0"         # Sun 10:05 UTC = 6:05 AM EDT - Saturday's games
    - cron: "5 5 * * 1"          # Mon 05:05 UTC = 1:05 AM EDT Monday - Sunday's NFL games
    # None on Tuesday: the Tuesday line comes from the Pull Splits run you
    # start by hand on Tuesday (after pasting the Splash lines). That run also
    # grades Monday night's game.
  workflow_dispatch: {} # lets you trigger a manual pull from the Actions tab

permissions:
  contents: write

concurrency:
  group: pull-splits
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull splits from Action Network
        env:
          # Optional: published CSV of the Splash Lines sheet tab. Unset = use
          # DraftKings' Tuesday line as the lock line instead.
          SPLASH_LINES_CSV_URL: ${{ vars.SPLASH_LINES_CSV_URL }}
        run: python scripts/fetch_splits.py

      # Rebase before pushing: the other sync workflows push to the same
      # branch, and this job only ever touches data/splits/, so a rebase
      # can't conflict with them.
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/splits/
          git diff --staged --quiet && exit 0
          git commit -m "Pull splits ($(date -u +%F))"
          git pull --rebase
          git push
