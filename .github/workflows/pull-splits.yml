name: Pull Splits

on:
  schedule:
    # 15:23 UTC = ~10:23 AM EST / 11:23 AM EDT, every day. Off the top of
    # the hour (GitHub's busiest slot) and clear of the 14:00-14:07 lines,
    # ledger and picks pulls. Early enough to snapshot before Saturday's
    # noon Eastern college kickoffs.
    - cron: "23 15 * * *"
    # Saturday pre-lock pulls. Contest picks lock at 11:00 AM Eastern
    # Saturday, and the daily slot above lands after that during EDT.
    # Two early slots because GitHub often starts scheduled runs late:
    # 11:47 UTC = 7:47 AM EDT / 6:47 AM EST, 13:17 UTC = 9:17 AM EDT / 8:17 AM EST.
    - cron: "47 11 * * 6"
    - cron: "17 13 * * 6"
  workflow_dispatch: {} # lets you trigger a manual pull from the Actions tab

permissions:
  contents: write

concurrency:
  group: pull-splits
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull splits from Action Network
        run: python scripts/fetch_splits.py

      # Rebase before pushing: the other sync workflows push to the same
      # branch, and this job only ever touches data/splits/, so a rebase
      # can't conflict with them.
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/splits/
          git diff --staged --quiet && exit 0
          git commit -m "Pull splits ($(date -u +%F))"
          git pull --rebase
          git push
