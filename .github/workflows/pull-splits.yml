name: Pull Splits

on:
  schedule:
    # Every 2 hours from Wednesday 5 AM Eastern through Monday night. Cron is
    # UTC-only: 09:05 UTC = 5:05 AM EDT / 4:05 AM EST. :05 instead of :00
    # because the top of the hour is GitHub's most delayed slot.
    #
    # Pulls after the Saturday lock only bring in final scores: fetch_splits.py
    # freezes every game at kickoff or Saturday 10:30 AM Eastern, whichever
    # comes first (lock_time), so no later line or split ever reaches the page.
    #
    # None on Tuesday (Eastern): the Tuesday line comes from the Pull Splits
    # run you start by hand on Tuesday. Scheduled runs never take it, even if
    # GitHub starts a Monday-night run after midnight.
    - cron: "5 9-23/2 * * 3"         # Wed 09:05-23:05 UTC
    - cron: "5 1-23/2 * * 4,5,6,0,1" # Thu-Mon, every odd UTC hour
    - cron: "5 14 * * 6"             # Sat 14:05 UTC = 10:05 AM EDT / 9:05 AM EST, closest slot to the lock
    - cron: "5 1,3 * * 2"            # Mon 9:05 and 11:05 PM EDT (01:05, 03:05 UTC Tuesday)
  workflow_dispatch: {} # lets you trigger a manual pull from the Actions tab

permissions:
  contents: write

concurrency:
  group: pull-splits
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull splits from Action Network
        env:
          # Optional: published CSV of the Splash Lines sheet tab. Unset = use
          # DraftKings' Tuesday line as the lock line instead.
          SPLASH_LINES_CSV_URL: ${{ vars.SPLASH_LINES_CSV_URL }}
        run: python scripts/fetch_splits.py

      # Rebase before pushing: the other sync workflows push to the same
      # branch, and this job only ever touches data/splits/, so a rebase
      # can't conflict with them.
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/splits/
          git diff --staged --quiet && exit 0
          git commit -m "Pull splits ($(date -u +%F))"
          git pull --rebase
          git push
