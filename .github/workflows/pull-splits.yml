name: Pull Splits

on:
  schedule:
    # Every 2 hours from Wednesday 5 AM Eastern until Saturday's 10 AM
    # Eastern pick deadline - nothing after it on Saturday. Cron is UTC-only:
    # 09:05 UTC = 5:05 AM EDT, but 4:05 AM EST once daylight saving ends in
    # November. :05 instead of :00 because the top of the hour is GitHub's
    # most delayed slot.
    - cron: "5 9-23/2 * * 3"   # Wed 09:05-23:05 UTC
    - cron: "5 1-23/2 * * 4,5" # Thu, Fri - every odd UTC hour
    - cron: "5 1-13/2 * * 6"   # Sat 01:05-13:05 UTC (last = 9:05 AM EDT / 8:05 AM EST, before the deadline)
    # Once a day Mon-Tue (no Sunday) to grade finished flags and keep snapshots.
    - cron: "23 15 * * 1,2"
  workflow_dispatch: {} # lets you trigger a manual pull from the Actions tab

permissions:
  contents: write

concurrency:
  group: pull-splits
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull splits from Action Network
        env:
          # Optional: published CSV of the Splash Lines sheet tab. Unset = use
          # DraftKings' Tuesday line as the lock line instead.
          SPLASH_LINES_CSV_URL: ${{ vars.SPLASH_LINES_CSV_URL }}
        run: python scripts/fetch_splits.py

      # Rebase before pushing: the other sync workflows push to the same
      # branch, and this job only ever touches data/splits/, so a rebase
      # can't conflict with them.
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/splits/
          git diff --staged --quiet && exit 0
          git commit -m "Pull splits ($(date -u +%F))"
          git pull --rebase
          git push
