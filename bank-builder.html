<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickFive — Bank Builder</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
  #content table th,
  #content table td {
    text-align: center;
  }

  td.balance-pos { color: var(--up); font-weight: 600; }
  td.balance-neg { color: var(--down); font-weight: 600; }

  .week-block {
    max-width: 1100px;
    margin: 0 auto 2rem;
  }

  .week-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
</style>
</head>
<body>

<div id="nav-placeholder"></div>
<script src="assets/nav.js"></script>

<header>
  <img class="logo" src="assets/bank_builder_header.png" alt="Bank Builder">
  <p class="sub">Weekly wager log, oldest to newest.</p>
</header>

<div class="status" id="status">Loading entries&hellip;</div>

<div id="content" style="display:none;"></div>

<div class="empty-state" id="empty-state" style="display:none;">
  No entries yet.
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCJ1xEWWQHvRJVkAtSH1OpjCxHtYvk1YXmKSsTspXwu3jkebG81SDs1_NB9ALOnV2zrUMvhwpyy4zi/pub?gid=249916722&single=true&output=csv";

  const HEADER_ALIASES = {
    "week": "week",
    "wager": "wager",
    "pick": "pick",
    "amount": "amount",
    "payout": "payout",
    "net": "net",
    "total": "total",
  };

  // Proper CSV parser - handles quoted fields with embedded commas
  // ("3-team parlay, MNF included") and escaped quotes (""), which a
  // plain split(',') would silently corrupt.
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += c;
        }
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.length > 1 || r[0] !== "");
  }

  function normalizeHeader(h) {
    const key = (h || "").trim().toLowerCase();
    return HEADER_ALIASES[key] || key;
  }

  function normalizeNumber(v) {
    v = (v || "").trim();
    if (!v) return null;
    const negative = v.startsWith("(") && v.endsWith(")");
    v = v.replace(/[()]/g, "");
    v = v.replace(/[$,]/g, "").trim();
    if (!v) return null;
    const n = parseFloat(v);
    if (Number.isNaN(n)) return null;
    return negative ? -n : n;
  }

  function normalizeWeek(v) {
    v = (v || "").trim();
    if (!v) return null;
    const n = parseInt(v, 10);
    return Number.isNaN(n) ? null : n;
  }

  async function loadEntries() {
    try {
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 1) return { entries: [], error: null };

      const headers = rows[0].map(normalizeHeader);
      const entries = [];

      for (const raw of rows.slice(1)) {
        const row = {};
        headers.forEach((h, i) => { row[h] = raw[i]; });

        const week = normalizeWeek(row.week);
        const wager = (row.wager || "").trim();
        const pick = (row.pick || "").trim();

        if (week === null || !wager || !pick) continue; // mirrors the sync script's required-field check

        entries.push({
          week,
          wager,
          pick,
          amount: normalizeNumber(row.amount),
          payout: normalizeNumber(row.payout),
          net: normalizeNumber(row.net),
          total: normalizeNumber(row.total),
        });
      }

      return { entries, error: null };
    } catch (e) {
      return { entries: null, error: e.message || "fetch failed" };
    }
  }

  function fmtMoney(n) {
    if (n === null || n === undefined) return "—";
    const sign = n < 0 ? "-" : "";
    return `${sign}$${Math.abs(n).toFixed(2)}`;
  }

  function groupByWeek(entries) {
    const byWeek = {};
    for (const e of entries) {
      if (!byWeek[e.week]) byWeek[e.week] = [];
      byWeek[e.week].push(e);
    }
    return Object.keys(byWeek)
      .map(Number)
      .sort((a, b) => a - b) // oldest week first
      .map((week) => ({ week, rows: byWeek[week] }));
  }

  function renderWeek(week, rows) {
    const netClass = (n) => (n > 0 ? "balance-pos" : n < 0 ? "balance-neg" : "");

    const rowsHtml = rows
      .map(
        (e) => `
      <tr>
        <td class="team">${e.wager}</td>
        <td class="team">${e.pick}</td>
        <td class="num">${fmtMoney(e.amount)}</td>
        <td class="num">${fmtMoney(e.payout)}</td>
        <td class="${netClass(e.net)}">${fmtMoney(e.net)}</td>
        <td class="${netClass(e.total)}">${fmtMoney(e.total)}</td>
      </tr>
    `
      )
      .join("");

    return `
      <div class="week-block">
        <div class="week-title">Week ${week}</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Wager</th>
                <th>Pick</th>
                <th>Amount</th>
                <th>Payout</th>
                <th>Net</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  async function init() {
    const statusEl = document.getElementById("status");
    const { entries, error } = await loadEntries();

    if (error) {
      statusEl.textContent = "";
      const emptyEl = document.getElementById("empty-state");
      emptyEl.textContent = `Couldn't load data (${error}). Check the browser console for details.`;
      emptyEl.style.display = "block";
      return;
    }

    if (!entries || entries.length === 0) {
      statusEl.textContent = "";
      document.getElementById("empty-state").style.display = "block";
      return;
    }

    // Skip placeholder/no-data rows entirely - blank cells (null) and
    // literal 0s are treated the same here, since either way there's
    // nothing meaningful to show.
    const isEmptyRow = (e) =>
      (e.amount ?? 0) === 0 && (e.payout ?? 0) === 0 && (e.net ?? 0) === 0 && (e.total ?? 0) === 0;
    const visibleEntries = entries.filter((e) => !isEmptyRow(e));

    if (visibleEntries.length === 0) {
      statusEl.textContent = "";
      document.getElementById("empty-state").style.display = "block";
      return;
    }

    const weeks = groupByWeek(visibleEntries);
    statusEl.textContent = "";

    const content = document.getElementById("content");
    content.innerHTML = weeks.map(({ week, rows }) => renderWeek(week, rows)).join("");
    content.style.display = "block";
  }

  init();
</script>

</body>
</html>
