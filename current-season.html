<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickFive — Current Season</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* Picks-page-only override - center everything in both tables,
     rather than changing the shared right/left alignment rules
     used elsewhere on the site. */
  #standings-table th,
  #standings-table td,
  #history-table th,
  #history-table td {
    text-align: center;
  }
</style>
</head>
<body>

<div id="nav-placeholder"></div>
<script src="assets/nav.js"></script>

<header>
  <img class="logo" src="assets/pickfive_header.png" alt="PickFive">
  <p class="sub" id="season-sub">One pick a week per person, entered from the contest site. Click any header to sort.</p>
</header>

<div class="status" id="status">Loading picks&hellip;</div>

<div id="content" style="display:none;">

  <div class="section-title">Standings</div>
  <div class="table-wrap">
    <table id="standings-table">
      <thead>
        <tr>
          <th data-key="person" data-type="string">Person</th>
          <th data-key="wins" data-type="number">W</th>
          <th data-key="losses" data-type="number">L</th>
          <th data-key="win_pct" data-type="number">W%</th>
          <th data-key="home_pct" data-type="number">Home W%</th>
          <th data-key="away_pct" data-type="number">Away W%</th>
          <th data-key="fav_pct" data-type="number">Fav W%</th>
          <th data-key="dog_pct" data-type="number">Dog W%</th>
          <th data-key="pending" data-type="number">Pending</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section-title">Pick History</div>
  <div class="table-wrap">
    <table id="history-table">
      <thead>
        <tr>
          <th data-key="week_sort" data-type="number">Week</th>
          <th data-key="person" data-type="string">Person</th>
          <th data-key="team_picked" data-type="string">Team</th>
          <th data-key="home_away" data-type="string">Home/Away</th>
          <th data-key="fav_dog" data-type="string">Fav/Dog</th>
          <th data-key="spread" data-type="number">Spread</th>
          <th data-key="result" data-type="string">Result</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<div class="empty-state" id="empty-state" style="display:none;">
  No picks yet.
</div>

<script src="assets/picks-shared.js"></script>
<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCJ1xEWWQHvRJVkAtSH1OpjCxHtYvk1YXmKSsTspXwu3jkebG81SDs1_NB9ALOnV2zrUMvhwpyy4zi/pub?gid=997480298&single=true&output=csv";

  const HEADER_ALIASES = {
    "year": "year",
    "week": "week",
    "person": "person",
    "team picked": "team_picked",
    "team_picked": "team_picked",
    "team": "team_picked",
    "home/away": "home_away",
    "home or away": "home_away",
    "spread": "spread",
    "result": "result",
    "w/l": "result",
  };

  // Proper CSV parser - handles quoted fields with embedded commas and
  // escaped quotes, which a plain split(',') would silently corrupt.
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += c;
        }
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.length > 1 || r[0] !== "");
  }

  function normalizeHeader(h) {
    const key = (h || "").trim().toLowerCase();
    return HEADER_ALIASES[key] || key;
  }

  function normalizeHomeAway(v) {
    v = (v || "").trim().toLowerCase();
    if (v.startsWith("home")) return "Home";
    if (v.startsWith("away")) return "Away";
    return null;
  }

  function deriveFavDog(spread) {
    if (spread === null) return null;
    if (spread < 0) return "Favorite";
    if (spread > 0) return "Underdog";
    return "Pick'em";
  }

  function normalizeResult(v) {
    v = (v || "").trim().toUpperCase();
    if (v === "W" || v === "WIN") return "W";
    if (v === "L" || v === "LOSS") return "L";
    return null;
  }

  function normalizeYear(v) {
    v = (v || "").trim();
    if (!v) return null;
    const n = parseInt(v, 10);
    return Number.isNaN(n) ? null : n;
  }

  function normalizeSpread(v) {
    v = (v || "").trim().replace(/\+/g, "");
    if (!v) return null;
    const n = parseFloat(v);
    return Number.isNaN(n) ? null : n;
  }

  async function loadPicksLive() {
    try {
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 1) return { picks: [], error: null };

      const headers = rows[0].map(normalizeHeader);
      const picks = [];

      for (const raw of rows.slice(1)) {
        const row = {};
        headers.forEach((h, i) => { row[h] = raw[i]; });

        const year = normalizeYear(row.year);
        const week = (row.week || "").trim();
        const person = (row.person || "").trim();
        const team_picked = (row.team_picked || "").trim();

        if (year === null || !week || !person || !team_picked) continue; // mirrors the sync script's required-field check

        const spread = normalizeSpread(row.spread);
        picks.push({
          year,
          week,
          person,
          team_picked,
          home_away: normalizeHomeAway(row.home_away),
          fav_dog: deriveFavDog(spread),
          spread,
          result: normalizeResult(row.result),
        });
      }

      return { picks, error: null };
    } catch (e) {
      return { picks: null, error: e.message || "fetch failed" };
    }
  }

  async function init() {
    const statusEl = document.getElementById("status");
    const { picks: allPicks, error } = await loadPicksLive();

    if (error) {
      statusEl.textContent = "";
      const emptyEl = document.getElementById("empty-state");
      emptyEl.textContent = `Couldn't load data (${error}). Check the browser console for details.`;
      emptyEl.style.display = "block";
      return;
    }

    if (!allPicks || allPicks.length === 0) {
      statusEl.textContent = "";
      document.getElementById("empty-state").style.display = "block";
      return;
    }

    const year = latestYear(allPicks);
    const seasonPicks = year === null ? allPicks : allPicks.filter((p) => p.year === year);

    document.getElementById("season-sub").textContent =
      `${year ?? "Current"} season. Click any header to sort.`;
    statusEl.textContent = "";
    document.getElementById("content").style.display = "block";

    renderStandings(buildStandings(seasonPicks));
    renderHistory(seasonPicks, false);
  }

  init();
</script>

</body>
</html>
