<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickFive — Insider</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .advice-block {
    max-width: 700px;
    margin: 0 auto 1.5rem;
    padding: 1.25rem 1.5rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
  }

  .advice-week {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--amber);
    margin: 0 0 0.75rem;
    font-family: "Iowan Old Style", Georgia, serif;
  }

  .advice-block p {
    margin: 0.4rem 0;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="nav-placeholder"></div>
<script src="assets/nav.js"></script>

<header>
  <p class="sub" style="font-size:1.3rem;font-weight:600;color:var(--text);font-family:'Iowan Old Style',Georgia,serif;">Insider</p>
  <p class="sub">You found it.</p>
</header>

<div class="advice-block">
  <div class="advice-week">Week 2</div>
  <p>Don't believe in week 1 results.</p>
  <p>Stars tend to bounce back if they didn't do well in week 1.</p>
</div>

</body>
</html>
