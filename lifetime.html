<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickFive — Lifetime</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* Picks-page-only override - center everything in both tables,
     rather than changing the shared right/left alignment rules
     used elsewhere on the site. */
  #standings-table th,
  #standings-table td,
  #history-table th,
  #history-table td {
    text-align: center;
  }

  .filter-bar {
    max-width: 1100px;
    margin: 0 auto 0.75rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1.2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .filter-bar .filter-group {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .filter-bar select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.4rem 0.6rem;
    font-size: 0.9rem;
  }

  .stat-block {
    max-width: 1100px;
    margin: 0 auto 1.5rem;
    padding: 1rem 1.2rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
  }

  .stat-block .stat-line {
    margin: 0.25rem 0;
  }

  .stat-block .stat-label {
    color: var(--muted);
  }

  .stat-block .stat-value {
    color: var(--amber);
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="nav-placeholder"></div>
<script src="assets/nav.js"></script>

<header>
  <img class="logo" src="assets/pickfive_header.png" alt="PickFive">
  <p class="sub">All-time picks and standings. Click any header to sort.</p>
</header>

<div id="content" style="display:none;">

  <div class="filter-bar">
    <div class="filter-group">
      <label for="standings-year-filter">Year:</label>
      <select id="standings-year-filter">
        <option value="all">All Time</option>
      </select>
    </div>
  </div>

  <div class="section-title">Team Rollup</div>
  <div class="stat-block" id="team-rollup"></div>

  <div class="section-title">Standings</div>
  <div class="table-wrap">
    <table id="standings-table">
      <thead>
        <tr>
          <th data-key="person" data-type="string">Person</th>
          <th data-key="wins" data-type="number">W</th>
          <th data-key="losses" data-type="number">L</th>
          <th data-key="win_pct" data-type="number">W%</th>
          <th data-key="home_pct" data-type="number">Home W%</th>
          <th data-key="away_pct" data-type="number">Away W%</th>
          <th data-key="fav_pct" data-type="number">Fav W%</th>
          <th data-key="dog_pct" data-type="number">Dog W%</th>
          <th data-key="pending" data-type="number">Pending</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="filter-bar">
    <div class="filter-group">
      <label for="history-year-filter">Year:</label>
      <select id="history-year-filter">
        <option value="all">All Time</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="history-person-filter">Person:</label>
      <select id="history-person-filter">
        <option value="all">Everyone</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="history-homeaway-filter">Home/Away:</label>
      <select id="history-homeaway-filter">
        <option value="all">Both</option>
        <option value="Home">Home</option>
        <option value="Away">Away</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="history-favdog-filter">Fav/Dog:</label>
      <select id="history-favdog-filter">
        <option value="all">Both</option>
        <option value="Favorite">Favorite</option>
        <option value="Underdog">Underdog</option>
      </select>
    </div>
  </div>

  <div class="section-title">Pick History</div>
  <div class="table-wrap">
    <table id="history-table">
      <thead>
        <tr>
          <th data-key="year" data-type="number">Year</th>
          <th data-key="week_sort" data-type="number">Week</th>
          <th data-key="person" data-type="string">Person</th>
          <th data-key="team_picked" data-type="string">Team</th>
          <th data-key="home_away" data-type="string">Home/Away</th>
          <th data-key="fav_dog" data-type="string">Fav/Dog</th>
          <th data-key="spread" data-type="number">Spread</th>
          <th data-key="result" data-type="string">Result</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<div class="empty-state" id="empty-state" style="display:none;">
  No picks yet. Once the sheet sync runs, picks will show up here.
</div>

<script src="assets/picks-shared.js"></script>
<script>
  let ALL_PICKS = [];

  const CATEGORY_LABELS = {
    "Home|Favorite": "Home Favorite",
    "Home|Underdog": "Home Underdog",
    "Away|Favorite": "Away Favorite",
    "Away|Underdog": "Away Underdog",
  };

  function buildTeamRollup(picks) {
    let wins = 0;
    let losses = 0;
    for (const p of picks) {
      if (p.result === "W") wins += 1;
      else if (p.result === "L") losses += 1;
    }
    const total = wins + losses;
    return { wins, losses, winPct: total === 0 ? null : wins / total };
  }

  function buildBestCategory(picks) {
    const buckets = {
      "Home|Favorite": { w: 0, l: 0 },
      "Home|Underdog": { w: 0, l: 0 },
      "Away|Favorite": { w: 0, l: 0 },
      "Away|Underdog": { w: 0, l: 0 },
    };

    for (const p of picks) {
      if (p.result !== "W" && p.result !== "L") continue;
      if (!p.home_away || !p.fav_dog) continue;
      const key = `${p.home_away}|${p.fav_dog}`;
      if (!buckets[key]) continue; // e.g. "Pick'em" fav_dog isn't one of the four categories
      buckets[key][p.result === "W" ? "w" : "l"] += 1;
    }

    let best = null;
    for (const [key, b] of Object.entries(buckets)) {
      const total = b.w + b.l;
      if (total === 0) continue;
      const pct = b.w / total;
      // Ties broken by larger sample size, so a 2-0 category doesn't
      // outrank a 20-8 category just because its percentage is higher.
      if (!best || pct > best.pct || (pct === best.pct && total > best.total)) {
        best = { label: CATEGORY_LABELS[key], pct, w: b.w, l: b.l, total };
      }
    }
    return best;
  }

  function renderTeamRollup(picks) {
    const rollup = buildTeamRollup(picks);
    const best = buildBestCategory(picks);

    const rollupLine =
      rollup.wins + rollup.losses === 0
        ? `<span class="stat-label">Team record:</span> <span class="stat-value">No decided picks yet</span>`
        : `<span class="stat-label">Team record:</span> <span class="stat-value">${rollup.wins}-${rollup.losses} (${fmtPct(rollup.winPct)})</span>`;

    const bestLine = best
      ? `<span class="stat-label">Best Overall Category:</span> <span class="stat-value">${best.label} — ${fmtPct(best.pct)} (${best.w}-${best.l})</span>`
      : `<span class="stat-label">Best Overall Category:</span> <span class="stat-value">Not enough decided picks yet</span>`;

    document.getElementById("team-rollup").innerHTML = `
      <div class="stat-line">${rollupLine}</div>
      <div class="stat-line">${bestLine}</div>
    `;
  }

  function populateSelect(select, values, allLabel) {
    select.innerHTML = `<option value="all">${allLabel}</option>`;
    for (const v of values) {
      const opt = document.createElement("option");
      opt.value = String(v);
      opt.textContent = v;
      select.appendChild(opt);
    }
  }

  function refreshStandings() {
    const year = document.getElementById("standings-year-filter").value;
    const picks = year === "all" ? ALL_PICKS : ALL_PICKS.filter((p) => String(p.year) === year);
    renderTeamRollup(picks);
    renderStandings(buildStandings(picks));
  }

  function refreshHistory() {
    const year = document.getElementById("history-year-filter").value;
    const person = document.getElementById("history-person-filter").value;
    const homeAway = document.getElementById("history-homeaway-filter").value;
    const favDog = document.getElementById("history-favdog-filter").value;

    const picks = ALL_PICKS.filter((p) => {
      if (year !== "all" && String(p.year) !== year) return false;
      if (person !== "all" && p.person !== person) return false;
      if (homeAway !== "all" && p.home_away !== homeAway) return false;
      if (favDog !== "all" && p.fav_dog !== favDog) return false;
      return true;
    });

    renderHistory(picks, true);
  }

  async function init() {
    ALL_PICKS = (await loadPicks()) || [];

    if (ALL_PICKS.length === 0) {
      document.getElementById("empty-state").style.display = "block";
      return;
    }

    populateSelect(document.getElementById("standings-year-filter"), distinctYears(ALL_PICKS), "All Time");
    populateSelect(document.getElementById("history-year-filter"), distinctYears(ALL_PICKS), "All Time");

    const people = [...new Set(ALL_PICKS.map((p) => p.person))].sort();
    populateSelect(document.getElementById("history-person-filter"), people, "Everyone");

    document.getElementById("standings-year-filter").addEventListener("change", refreshStandings);
    document.getElementById("history-year-filter").addEventListener("change", refreshHistory);
    document.getElementById("history-person-filter").addEventListener("change", refreshHistory);
    document.getElementById("history-homeaway-filter").addEventListener("change", refreshHistory);
    document.getElementById("history-favdog-filter").addEventListener("change", refreshHistory);

    document.getElementById("content").style.display = "block";

    refreshStandings();
    refreshHistory();
  }

  init();
</script>

</body>
</html>
