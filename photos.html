<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickFive Photos</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/styles.css">
<!-- No web app manifest on purpose: iPhone's Add to Home Screen then saves this
     exact address (GitHub's own manifest sends its icon to github.com/ instead). -->
<style>
  main {
    max-width: 520px; margin: 0 auto; padding: 1.5rem 1rem; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .logo { max-width: 260px; width: 70%; margin: 0.5rem auto 1.25rem; display: block; }
  a.big {
    display: block; padding: 0.9rem; margin: 0 0 0.75rem; border-radius: 10px;
    font-size: 1.15rem; font-weight: 700; text-decoration: none;
  }
  a.upload { background: var(--amber); color: var(--bg); }
  a.small { display: inline-block; margin: 0.6rem 0 0; color: var(--muted); font-size: 0.9rem; }
  section { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 0.9rem 1rem 1rem; margin: 0 0 1rem; }
  .note { color: var(--muted); font-size: 0.85rem; line-height: 1.5; margin: 1rem 0; }
  h2 { font-family: "Iowan Old Style", Georgia, serif; font-size: 1.05rem; margin: 0 0 0.7rem; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .thumbs img { height: 90px; width: auto; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/pickfive_header.png" alt="PickFive">
  <section>
    <h2 id="weekly-title">Weekly Lines</h2>
    <a class="big upload" href="https://github.com/WiggyWigs/PickFive/upload/main/images/weekly-lines">Upload to Weekly Lines</a>
    <div class="thumbs" id="weekly-thumbs"></div>
    <a class="small" href="index.html">See Weekly Lines</a>
  </section>
  <section>
    <h2 id="live-title">Live Lines</h2>
    <a class="big upload" href="https://github.com/WiggyWigs/PickFive/upload/main/images/live-lines">Upload to Live Lines</a>
    <div class="thumbs" id="live-thumbs"></div>
    <a class="small" href="live-lines.html">See Live Lines</a>
  </section>
  <p class="note">Upload opens GitHub's upload page for that page's photo folder: choose your files, then
    <strong>Commit changes</strong>. They show up about a minute later. Both folders are cleared every
    Tuesday morning.</p>
</main>
<script src="assets/photos.js"></script>
<script>
  for (const [folder, el, title, name] of [
    ["images/weekly-lines", "weekly-thumbs", "weekly-title", "Weekly Lines"],
    ["images/live-lines", "live-thumbs", "live-title", "Live Lines"],
  ]) {
    PickFivePhotos.showPhotos(folder, el).then((files) => {
      document.getElementById(title).textContent = `${name} · ${files.length ? `${files.length} up this week` : "no photos this week"}`;
    });
  }
</script>
</body>
</html>
